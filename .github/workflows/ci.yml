name: CI

on:
  pull_request:
  push:
    branches: [main]

# Job names ARE the GitHub check names. Required on main (needs admin):
#   install, typecheck, test
# plus "Require branches to be up to date before merging" (strict).
# typecheck runs `npm run build` — the same compile Render uses
# (`npm install && npm run build`). It emits dist/; it is not tsc --noEmit.
# test runs migrations against a Postgres 16 service, then npm test.
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prove emit (not tsc --noEmit)
        run: test -f dist/index.js

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: highway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/highway
      DB_SCHEMA: highway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm test
      - name: Backfill dry plan (zero Firestore)
        run: npm run backfill:messages
