# Nightly pg_dump. Ready for the DATABASE_URL GitHub Actions secret
# (Sin sets it after the Supabase project exists). Skips cleanly when unset.
# Artifact cap on GitHub Free is 500 MB — keep dumps small.

name: Nightly Postgres dump

on:
  schedule:
    - cron: "15 7 * * *" # ~00:15 PT
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump
        id: dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_FALLBACK: ${{ secrets.DATABASE_URL_FALLBACK }}
        run: |
          set -euo pipefail
          URL="${DATABASE_URL:-}"
          if [ -z "$URL" ]; then URL="${DATABASE_URL_FALLBACK:-}"; fi
          if [ -z "$URL" ]; then
            echo "DATABASE_URL secret unset — skip. MONEY SNATCHER 3000: set Actions secrets DATABASE_URL and DATABASE_URL_FALLBACK (session pooler URLs). This agent cannot write repo secrets (403)."
            echo "have=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          STAMP=$(date -u +%Y%m%d)
          HOST=$(node -e 'try{console.log(new URL(process.argv[1]).hostname)}catch(e){console.log("unknown")}' "$URL")
          echo "dump host=$HOST"
          pg_dump --no-owner --no-acl --schema=highway -Fc -f "highway-${STAMP}.dump" "$URL"
          ls -lh "highway-${STAMP}.dump"
          echo "have=1" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        if: steps.dump.outputs.have == '1'
        uses: actions/upload-artifact@v4
        with:
          name: highway-pg-dump
          path: highway-*.dump
          retention-days: 14
          if-no-files-found: ignore
