services:
  - type: web
    name: highway-chat-mcp
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_API_KEY
        sync: false
      - key: MCP_SECRET
        sync: false
      - key: UPLOAD_ALLOWED_EMAILS
        sync: false
      - key: MCP_CALLERS
        sync: false
      - key: LEGACY_PATH_AUTH
        value: "on"
      - key: READ_CACHE_TTL_MS
        value: "15000"
      - key: READ_BUDGET_DAILY
        value: "20000"
